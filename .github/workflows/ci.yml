name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install

      - name: Tests
        run: npm test

      # The pages are prerendered at build time, so a page that no longer
      # compiles against the engine fails here rather than in a browser.
      - name: Build
        run: npm run build:web
