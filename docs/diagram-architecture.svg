<rect x="0" y="0" width="760" height="436" fill="#ffffff"/>
<text x="88.0" y="30.0" text-anchor="end" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="#5a6070">DEMO</text>
<rect x="100" y="8" width="651" height="36" rx="5" fill="#ffffff" stroke="#d9dce3" stroke-width="1" stroke-dasharray="4 3"/>
