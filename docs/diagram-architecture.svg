<text x="125.0" y="369.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">int8 weights, per-channel scales, fused ops</text>
<circle cx="117" cy="379.5" r="1.7" fill="#9aa2b1"/>
<text x="125.0" y="383.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Workers over SharedArrayBuffer</text>
