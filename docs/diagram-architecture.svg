<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" role="img" aria-label="Cadence architecture: a five-stage synthesis pipeline over one kernel interface with a CPU and a GPU backend, fed by a library of more than two hundred built-in voices">
