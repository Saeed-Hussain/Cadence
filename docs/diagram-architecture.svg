<text x="425.5" y="104.0" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5a6070">phonemes → mel</text>
<rect x="502" y="62" width="115" height="56" rx="5" fill="#f7f8fa" stroke="#d9dce3" stroke-width="1"/>
