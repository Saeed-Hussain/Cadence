<text x="449.0" y="307.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1f4f8f">GPU backend</text>
<text x="449.0" y="322.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5a6070">WGSL compute  ·  when available</text>
<circle cx="452" cy="337.5" r="1.7" fill="#9aa2b1"/>
<text x="460.0" y="341.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Tiled matmul in workgroup memory</text>
<circle cx="452" cy="351.5" r="1.7" fill="#9aa2b1"/>
<text x="460.0" y="355.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Fused dequantise → multiply</text>
<circle cx="452" cy="365.5" r="1.7" fill="#9aa2b1"/>
<text x="460.0" y="369.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Same operator set, same tests</text>
<circle cx="452" cy="379.5" r="1.7" fill="#9aa2b1"/>
<text x="460.0" y="383.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Carries the larger cloning model</text>
<line x1="100" y1="406" x2="751" y2="406" stroke="#d9dce3"/>
<text x="100.0" y="424.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5a6070" font-style="italic">The same engine package runs unchanged in the browser, in Node and in Electron. No framework is imported below the demo layer.</text>
</svg>