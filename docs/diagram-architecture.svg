<text x="88.0" y="252.0" text-anchor="end" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="#5a6070">KERNELS</text>
<rect x="100" y="230" width="651" height="38" rx="5" fill="#eef2f8" stroke="#c3d0e2" stroke-width="1"/>
