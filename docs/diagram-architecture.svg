<line x1="559.5" y1="122.0" x2="559.5" y2="227.0" stroke="#8b93a3" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="571.0" y="160.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="400" fill="#5a6070" font-style="italic">all tensor compute runs here</text>
<text x="88.0" y="312.0" text-anchor="end" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600" fill="#5a6070">BACKENDS</text>
<rect x="100" y="286" width="316" height="100" rx="5" fill="#f7f8fa" stroke="#d9dce3"/>
<text x="114.0" y="307.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#1f4f8f">CPU backend</text>
<text x="114.0" y="322.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#5a6070">WebAssembly SIMD  ·  default</text>
<circle cx="117" cy="337.5" r="1.7" fill="#9aa2b1"/>
<text x="125.0" y="341.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Hand-written GEMM microkernel</text>
<circle cx="117" cy="351.5" r="1.7" fill="#9aa2b1"/>
<text x="125.0" y="355.0" text-anchor="start" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#16181d">Cache blocking, register tiling, packing</text>
