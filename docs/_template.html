<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cadence — Proposal</title>
<style>
  @page { size: A4; margin: 20mm 18mm 18mm 18mm; }
  :root { --ink:#16181d; --muted:#5a6070; --rule:#d9dce3; --accent:#1f4f8f; --code-bg:#f4f5f7; }
  * { box-sizing: border-box; }
  body {
    font-family: "Charter","Georgia","Cambria",serif;
    font-size: 10.5pt; line-height: 1.55; color: var(--ink);
    margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    text-rendering: optimizeLegibility;
  }
  h1, h2, h3, h4 {
    font-family: "Segoe UI","Helvetica Neue",Arial,sans-serif;
    line-height: 1.25; break-after: avoid; page-break-after: avoid;
  }
  h1 { font-size: 30pt; margin: 0 0 .1em; letter-spacing: -.02em; }
  h1 + h2 {
    border: 0; font-size: 14pt; font-weight: 400; color: var(--muted);
    margin: 0 0 1.4em; padding: 0;
  }
  h2 {
    font-size: 14pt; margin: 2em 0 .7em; padding-bottom: .3em;
    border-bottom: 1.5px solid var(--rule);
  }
  h3 { font-size: 11.5pt; margin: 1.5em 0 .5em; color: var(--accent); }
  p { margin: 0 0 .85em; orphans: 3; widows: 3; }
  strong { font-weight: 600; }
  a { color: var(--accent); text-decoration: none; }
  ul, ol { margin: 0 0 .9em; padding-left: 1.3em; }
  li { margin-bottom: .35em; }
  li::marker { color: var(--muted); }
  code {
    font-family: "Cascadia Mono","Consolas","SF Mono",monospace;
    font-size: .85em; background: var(--code-bg); padding: .1em .35em;
    border-radius: 3px; color: #2c3140;
  }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 1.6em 0; }
  img {
    display: block; max-width: 100%; height: auto; margin: 1.3em auto;
    break-inside: avoid; page-break-inside: avoid;
  }
  table {
    border-collapse: collapse; width: 100%; margin: 0 0 1.2em;
    font-size: 9.5pt; break-inside: avoid; page-break-inside: avoid;
  }
  th, td {
    border: 1px solid var(--rule); padding: .45em .6em;
    text-align: left; vertical-align: top;
  }
  th {
    background: #f0f2f5;
    font-family: "Segoe UI",Arial,sans-serif; font-weight: 600; font-size: 9pt;
  }
  tbody tr:nth-child(even) { background: #fafbfc; }
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
